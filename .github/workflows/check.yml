name: Check

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check
      - name: Server starts and answers
        run: |
          mkdir -p /tmp/data
          DATA_DIR=/tmp/data LIBRARY_DIR=/tmp/lib PORT=5057 node server.mjs &
          for i in $(seq 1 20); do curl -sf http://localhost:5057/api/health && exit 0; sleep 1; done
          exit 1
