name: Feature request
description: Suggest an idea for Spokarr
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation – what are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Spokarr help? Screenshots or examples from other apps are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
