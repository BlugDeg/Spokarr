# Example setup. Adjust the volume paths to your system.
services:
  spokarr:
    image: ghcr.io/blugdeg/spokarr:latest
    container_name: spokarr
    restart: unless-stopped
    ports:
      - "5057:5057"
    volumes:
      - ./data:/data                 # settings, users, requests
      # The disk SABnzbd downloads to – imports are a fast move on the same disk
      - /path/to/media:/media
    environment:
      LIBRARY_DIR: /media/audiobooks # where Spokarr puts finished audiobooks
      PUID: 1000                     # run as the user that owns your media files
      PGID: 1000
